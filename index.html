<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <title>Despega — De 0 a 1.000 usuarios sin ads</title>
  <meta name="description" content="El método UGC paso a paso para conseguir tus primeros 1.000 usuarios sin gastar en publicidad: persona, calentamiento de algoritmo, guiones que convierten y métricas de despegue." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============ Header ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" onclick="App.show('home');return false;">
        <span class="rocket">🚀</span><span>Despe<span class="brand-accent">ga</span></span>
      </a>
      <div class="topbar-actions">
        <div class="lang-switch">
          <button data-lang="es" onclick="App.setLang('es')">ES 🇨🇴</button>
          <button data-lang="en" onclick="App.setLang('en')">EN 🇺🇸</button>
          <button data-lang="pt" onclick="App.setLang('pt')">PT 🇧🇷</button>
        </div>
        <span id="plan-badge" class="plan-badge" onclick="App.show('pro')" style="cursor:pointer"></span>
      </div>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab" data-nav="home" onclick="App.show('home')">🏠 <span data-i18n="nav_home"></span></button>
      <button class="nav-tab" data-nav="persona" onclick="App.show('persona')">👤 <span data-i18n="nav_persona"></span></button>
      <button class="nav-tab" data-nav="warmup" onclick="App.show('warmup')">🔥 <span data-i18n="nav_warmup"></span></button>
      <button class="nav-tab" data-nav="scripts" onclick="App.show('scripts')">🎬 <span data-i18n="nav_scripts"></span></button>
      <button class="nav-tab" data-nav="protocol" onclick="App.show('protocol')">📤 <span data-i18n="nav_protocol"></span></button>
      <button class="nav-tab" data-nav="metrics" onclick="App.show('metrics')">📈 <span data-i18n="nav_metrics"></span></button>
      <button class="nav-tab" data-nav="pro" onclick="App.show('pro')">⚡ <span data-i18n="nav_pro"></span></button>
    </nav>
  </header>

  <main class="container">

    <!-- ============ INICIO ============ -->
    <section class="view" id="view-home">
      <div class="hero">
        <h1 data-i18n-html="hero_title"></h1>
        <p class="sub" data-i18n="hero_sub"></p>
        <div class="hero-ctas">
          <button class="btn primary" onclick="App.show('persona')" data-i18n="hero_cta_start"></button>
          <a class="btn ghost" href="#method-section" data-i18n="hero_cta_how"></a>
        </div>
        <div class="stats-row">
          <div class="stat-tile"><div class="num">5</div><div class="lbl" data-i18n="stat_steps"></div></div>
          <div class="stat-tile"><div class="num">$0</div><div class="lbl" data-i18n="stat_ads"></div></div>
          <div class="stat-tile"><div class="num">30</div><div class="lbl" data-i18n="stat_days"></div></div>
          <div class="stat-tile"><div class="num">3</div><div class="lbl" data-i18n="stat_langs"></div></div>
        </div>
      </div>

      <!-- Dashboard -->
      <div class="next-action" id="next-action"></div>
      <div class="dash-grid" id="dash-kpis" style="margin-bottom:16px"></div>

      <div class="card">
        <div class="flex between">
          <h3 data-i18n="dash_progress_title"></h3>
          <strong id="dash-progress-pct" style="color:var(--accent)"></strong>
        </div>
        <div class="progress-wrap mt-1 mb-2"><div class="progress-bar" id="dash-progress-bar" style="width:0%"></div></div>
        <div class="check-list" id="dash-progress-list"></div>
      </div>

      <!-- El método -->
      <div id="method-section">
        <h2 class="section-title" data-i18n="method_title"></h2>
        <p class="section-sub" data-i18n="method_sub"></p>
        <div class="method-grid">
          <div class="method-card" onclick="App.show('persona')" style="cursor:pointer">
            <div class="mnum">1</div><h4 data-i18n="m1_t"></h4><p data-i18n="m1_d"></p>
          </div>
          <div class="method-card" onclick="App.show('warmup')" style="cursor:pointer">
            <div class="mnum">2</div><h4 data-i18n="m2_t"></h4><p data-i18n="m2_d"></p>
          </div>
          <div class="method-card" onclick="App.show('scripts')" style="cursor:pointer">
            <div class="mnum">3</div><h4 data-i18n="m3_t"></h4><p data-i18n="m3_d"></p>
          </div>
          <div class="method-card" onclick="App.show('protocol')" style="cursor:pointer">
            <div class="mnum">4</div><h4 data-i18n="m4_t"></h4><p data-i18n="m4_d"></p>
          </div>
          <div class="method-card" onclick="App.show('metrics')" style="cursor:pointer">
            <div class="mnum">5</div><h4 data-i18n="m5_t"></h4><p data-i18n="m5_d"></p>
          </div>
        </div>
      </div>

      <!-- Datos -->
      <div class="card mt-3">
        <h3 data-i18n="data_title"></h3>
        <p class="hint" data-i18n="data_sub"></p>
        <div class="flex flex-wrap">
          <button class="btn sm" onclick="Pro.exportData()" data-i18n="data_export"></button>
          <label class="btn sm" style="margin:0">
            <span data-i18n="data_import"></span>
            <input type="file" accept="application/json" class="hidden" onchange="Pro.importData(this)" />
          </label>
          <button class="btn sm danger" onclick="Pro.resetData()" data-i18n="data_reset"></button>
        </div>
      </div>
    </section>

    <!-- ============ PASO 1: PERSONA ============ -->
    <section class="view" id="view-persona">
      <div class="view-head">
        <span class="step-tag" data-i18n="persona_tag"></span>
        <h2 data-i18n="persona_title"></h2>
        <p data-i18n="persona_sub"></p>
      </div>

      <div class="card-row cols-2">
        <div class="card">
          <div class="field-row">
            <div class="field">
              <label data-i18n="p_name"></label>
              <input id="p-name" data-i18n-ph="p_name_ph" />
            </div>
            <div class="field">
              <label data-i18n="p_age"></label>
              <input id="p-age" inputmode="numeric" placeholder="19" />
            </div>
          </div>
          <div class="field">
            <label data-i18n="p_occupation"></label>
            <input id="p-occupation" data-i18n-ph="p_occupation_ph" />
          </div>
          <div class="field">
            <label data-i18n="p_pains"></label>
            <textarea id="p-pains" rows="4" data-i18n-ph="p_pains_ph"></textarea>
            <div class="subhint" data-i18n="p_pains_hint"></div>
          </div>
          <div class="field">
            <label data-i18n="p_wants"></label>
            <textarea id="p-wants" rows="3" data-i18n-ph="p_wants_ph"></textarea>
          </div>
          <div class="field">
            <label data-i18n="p_platforms"></label>
            <div class="chips" id="p-platforms">
              <label class="chip"><input type="checkbox" value="TikTok" checked /> TikTok</label>
              <label class="chip"><input type="checkbox" value="Instagram" /> Instagram</label>
              <label class="chip"><input type="checkbox" value="YouTube Shorts" /> YouTube Shorts</label>
            </div>
          </div>
          <div class="field">
            <label data-i18n="p_content"></label>
            <input id="p-content" data-i18n-ph="p_content_ph" />
          </div>
          <div class="field">
            <label data-i18n="p_notes"></label>
            <textarea id="p-notes" rows="2"></textarea>
          </div>
          <div class="flex">
            <button class="btn primary" id="p-save-btn" onclick="Persona.savePersona()"></button>
            <button class="btn ghost" onclick="Persona.newPersona()" data-i18n="p_new"></button>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 data-i18n="p_saved_list"></h3>
            <div id="persona-list" class="mt-1"></div>
          </div>

          <div class="card">
            <h3>📱 <span data-i18n="product_title"></span></h3>
            <p class="hint" data-i18n="product_sub"></p>
            <div class="field">
              <label data-i18n="prod_name"></label>
              <input id="prod-name" data-i18n-ph="prod_name_ph" />
            </div>
            <div class="field">
              <label data-i18n="prod_desc"></label>
              <input id="prod-desc" data-i18n-ph="prod_desc_ph" />
            </div>
            <div class="field">
              <label data-i18n="prod_cat"></label>
              <select id="prod-cat">
                <option value="productividad">📋 Productividad</option>
                <option value="educacion">🎓 Educación</option>
                <option value="salud">💪 Salud & Fitness</option>
                <option value="finanzas">💰 Finanzas</option>
                <option value="social">💬 Social</option>
                <option value="juegos">🎮 Juegos</option>
                <option value="otra">✦ Otra</option>
              </select>
            </div>
            <button class="btn success" onclick="Persona.saveProduct()" data-i18n="prod_save"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ PASO 2: CALENTAMIENTO ============ -->
    <section class="view" id="view-warmup">
      <div class="view-head">
        <span class="step-tag" data-i18n="warm_tag"></span>
        <h2 data-i18n="warm_title"></h2>
        <p data-i18n="warm_sub"></p>
      </div>

      <div class="card" style="border-color:rgba(255,138,42,0.4);background:var(--accent-soft)">
        <div class="small">⚠️ <strong data-i18n="warm_rule"></strong></div>
      </div>

      <div class="card">
        <h3>🔍 <span data-i18n="warm_terms_title"></span></h3>
        <p class="hint" data-i18n="warm_terms_sub"></p>
        <div id="warm-terms"></div>
        <div class="flex mt-2">
          <input id="term-input" class="grow" data-i18n-ph="term_add_ph"
                 style="background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 13px;outline:none" />
          <button class="btn sm" onclick="Warmup.addTerm()" data-i18n="term_add"></button>
        </div>
      </div>

      <div class="card-row cols-2">
        <div class="card">
          <h3>✅ <span data-i18n="warm_check_title"></span></h3>
          <p class="hint" data-i18n="warm_check_sub"></p>
          <div class="check-list" id="warm-checklist"></div>
          <div class="mt-2">
            <div class="progress-wrap"><div class="progress-bar" id="warm-progress-bar" style="width:0%"></div></div>
            <div class="small muted mt-1" id="warm-progress-text"></div>
          </div>
        </div>

        <div class="card">
          <h3>📓 <span data-i18n="jargon_title"></span></h3>
          <p class="hint" data-i18n="jargon_sub"></p>
          <div class="field"><input id="jargon-term" data-i18n-ph="jargon_term_ph" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 13px;outline:none" /></div>
          <div class="field"><input id="jargon-ctx" data-i18n-ph="jargon_ctx_ph" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px 13px;outline:none" /></div>
          <button class="btn sm success" onclick="Warmup.addJargon()" data-i18n="jargon_add"></button>
          <div id="jargon-list" class="mt-2"></div>
        </div>
      </div>
    </section>

    <!-- ============ PASO 3: GUIONES ============ -->
    <section class="view" id="view-scripts">
      <div class="view-head">
        <span class="step-tag" data-i18n="scripts_tag"></span>
        <h2 data-i18n="scripts_title"></h2>
        <p data-i18n="scripts_sub"></p>
      </div>

      <div class="card">
        <div class="field">
          <label data-i18n="gen_format_lbl"></label>
          <div class="fmt-cards">
            <div class="fmt-card">
              <input type="radio" name="gen-format" value="hookdemo" id="fmt-hd" checked />
              <label for="fmt-hd"><div class="f-title">🎥 <span data-i18n="fmt_hookdemo"></span></div><div class="f-desc" data-i18n="fmt_hookdemo_d"></div></label>
            </div>
            <div class="fmt-card">
              <input type="radio" name="gen-format" value="longtext" id="fmt-lt" />
              <label for="fmt-lt"><div class="f-title">💬 <span data-i18n="fmt_longtext"></span></div><div class="f-desc" data-i18n="fmt_longtext_d"></div></label>
            </div>
            <div class="fmt-card">
              <input type="radio" name="gen-format" value="talking" id="fmt-tk" />
              <label for="fmt-tk"><div class="f-title">🗣 <span data-i18n="fmt_talking"></span></div><div class="f-desc" data-i18n="fmt_talking_d"></div></label>
            </div>
          </div>
        </div>
        <div class="field" style="max-width:340px">
          <label data-i18n="gen_persona_lbl"></label>
          <select id="gen-persona"></select>
        </div>
        <div class="card hidden" id="gen-notice" style="border-color:rgba(251,191,36,0.4);background:var(--warn-soft);padding:12px 16px;font-size:0.87rem"></div>
        <div class="flex between flex-wrap">
          <button class="btn primary" onclick="Guiones.generate()" data-i18n="gen_btn"></button>
          <span class="small muted" id="gen-left"></span>
        </div>
        <div class="script-output hidden" id="script-output"></div>
      </div>

      <div class="card">
        <h3>📚 <span data-i18n="lib_title"></span></h3>
        <div id="script-lib" class="mt-1"></div>
      </div>
    </section>

    <!-- ============ PASO 4: PROTOCOLO ============ -->
    <section class="view" id="view-protocol">
      <div class="view-head">
        <span class="step-tag" data-i18n="proto_tag"></span>
        <h2 data-i18n="proto_title"></h2>
        <p data-i18n="proto_sub"></p>
      </div>

      <div class="card-row cols-2">
        <div class="card">
          <h3>🧘 <span data-i18n="ritual_title"></span></h3>
          <p class="hint" data-i18n="ritual_sub"></p>
          <div class="check-list" id="ritual-list"></div>
        </div>

        <div class="card">
          <h3>📏 <span data-i18n="rules_title"></span></h3>
          <div class="script-rules mt-1">
            <div class="rule">1️⃣ <span data-i18n="pr_rule1"></span></div>
            <div class="rule">2️⃣ <span data-i18n="pr_rule2"></span></div>
            <div class="rule">3️⃣ <span data-i18n="pr_rule3"></span></div>
            <div class="rule">4️⃣ <span data-i18n="pr_rule4"></span></div>
          </div>
        </div>
      </div>

      <div id="post-guards" class="hidden"></div>

      <div class="card">
        <h3>📤 <span data-i18n="log_post_title"></span></h3>
        <div class="field-row">
          <div class="field">
            <label data-i18n="post_platform"></label>
            <select id="post-platform">
              <option value="TikTok">TikTok</option>
              <option value="Instagram">Instagram</option>
              <option value="TikTok + Instagram" data-i18n="platform_both"></option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="post_format"></label>
            <select id="post-format">
              <option value="hookdemo" data-i18n="fmt_hookdemo"></option>
              <option value="longtext" data-i18n="fmt_longtext"></option>
              <option value="talking" data-i18n="fmt_talking"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <label data-i18n="post_from_script"></label>
          <select id="post-script" onchange="Protocolo.pickScript()"></select>
        </div>
        <div class="field">
          <textarea id="post-hook" rows="2" data-i18n-ph="post_hook_ph"></textarea>
        </div>
        <button class="btn primary" onclick="Protocolo.logPost()" data-i18n="post_add"></button>
      </div>

      <div class="card">
        <h3>🗓 <span data-i18n="today_posts"></span></h3>
        <div id="today-posts" class="mt-1"></div>
      </div>
    </section>

    <!-- ============ PASO 5: MÉTRICAS ============ -->
    <section class="view" id="view-metrics">
      <div class="view-head">
        <span class="step-tag" data-i18n="met_tag"></span>
        <h2 data-i18n="met_title"></h2>
        <p data-i18n="met_sub"></p>
      </div>

      <div class="card">
        <p class="hint" data-i18n="met_update_hint"></p>
        <div id="metrics-table"></div>
      </div>

      <div id="insights"></div>

      <div class="card">
        <h3>🛫 <span data-i18n="milestones_title"></span></h3>
        <p class="hint" data-i18n="milestones_sub"></p>
        <div class="milestones mt-2" id="milestones"></div>
      </div>
    </section>

    <!-- ============ PRO ============ -->
    <section class="view" id="view-pro">
      <div class="view-head">
        <span class="step-tag" data-i18n="pro_tag"></span>
        <h2 data-i18n="pro_title"></h2>
        <p data-i18n="pro_sub"></p>
      </div>

      <div class="pricing-grid">
        <div class="price-card">
          <h3 data-i18n="plan_free_t"></h3>
          <div class="price" data-i18n="price_free"></div>
          <div class="per" data-i18n="per_free"></div>
          <ul>
            <li><span class="tick">✓</span> <span data-i18n="f_free_1"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_free_2"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_free_3"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_free_4"></span></li>
          </ul>
          <button class="btn block" id="buy-free" disabled></button>
        </div>

        <div class="price-card featured">
          <div class="pop-tag" data-i18n="most_popular"></div>
          <h3 data-i18n="plan_pro_t"></h3>
          <div class="price">$19.900 <span style="font-size:0.9rem;font-weight:600">COP</span></div>
          <div class="per" data-i18n="per_once"></div>
          <ul>
            <li><span class="tick">✓</span> <span data-i18n="f_pro_1"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_pro_2"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_pro_3"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_pro_4"></span></li>
          </ul>
          <button class="btn primary block" id="buy-pro" onclick="Pro.buy('pro')"></button>
        </div>

        <div class="price-card">
          <h3 data-i18n="plan_elite_t"></h3>
          <div class="price">$39.900 <span style="font-size:0.9rem;font-weight:600">COP</span></div>
          <div class="per" data-i18n="per_once"></div>
          <ul>
            <li><span class="tick">✓</span> <span data-i18n="f_elite_1"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_elite_2"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_elite_3"></span></li>
            <li><span class="tick">✓</span> <span data-i18n="f_elite_4"></span></li>
          </ul>
          <button class="btn block" id="buy-elite" onclick="Pro.buy('elite')"></button>
        </div>
      </div>

      <div class="card mt-2 center">
        <p class="hint" data-i18n="pay_note"></p>
        <div class="flex flex-wrap" style="justify-content:center">
          <button class="btn" onclick="UI.openModal('activate-modal')" data-i18n="btn_activate"></button>
          <a class="btn success" id="wa-link" target="_blank" rel="noopener" data-i18n="whatsapp_cta"></a>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ Footer ============ -->
  <footer>
    <div class="container">
      <div class="foot-brand">🚀 Despega</div>
      <div class="muted small mb-2" data-i18n="app_tagline"></div>

      <h3 class="small muted mb-1" data-i18n="legal_title" style="text-transform:uppercase;letter-spacing:0.08em"></h3>
      <details class="accordion">
        <summary data-i18n="leg_privacy_t"></summary>
        <div class="acc-body"><p data-i18n="leg_privacy_b"></p></div>
      </details>
      <details class="accordion">
        <summary data-i18n="leg_terms_t"></summary>
        <div class="acc-body"><p data-i18n="leg_terms_b"></p></div>
      </details>
      <details class="accordion">
        <summary data-i18n="leg_support_t"></summary>
        <div class="acc-body">
          <p data-i18n="leg_support_b"></p>
          <a class="btn sm success" id="wa-link-2" target="_blank" rel="noopener" data-i18n="whatsapp_cta"></a>
        </div>
      </details>
      <details class="accordion">
        <summary data-i18n="leg_refund_t"></summary>
        <div class="acc-body"><p data-i18n="leg_refund_b"></p></div>
      </details>

      <div class="foot-copy" data-i18n="foot_copy"></div>
    </div>
  </footer>

  <!-- ============ Nav inferior (móvil) ============ -->
  <nav class="bottom-nav">
    <button data-nav="home" onclick="App.show('home')"><span class="bn-icon">🏠</span><span data-i18n="nav_home"></span></button>
    <button data-nav="persona" onclick="App.show('persona')"><span class="bn-icon">👤</span><span data-i18n="nav_persona"></span></button>
    <button data-nav="warmup" onclick="App.show('warmup')"><span class="bn-icon">🔥</span><span data-i18n="nav_warmup"></span></button>
    <button data-nav="scripts" onclick="App.show('scripts')"><span class="bn-icon">🎬</span><span data-i18n="nav_scripts"></span></button>
    <button data-nav="protocol" onclick="App.show('protocol')"><span class="bn-icon">📤</span><span data-i18n="nav_protocol"></span></button>
    <button data-nav="metrics" onclick="App.show('metrics')"><span class="bn-icon">📈</span><span data-i18n="nav_metrics"></span></button>
    <button data-nav="pro" onclick="App.show('pro')"><span class="bn-icon">⚡</span><span data-i18n="nav_pro"></span></button>
  </nav>

  <!-- ============ Modales ============ -->
  <div class="modal-overlay" id="activate-modal">
    <div class="modal">
      <h3 data-i18n="act_title"></h3>
      <p class="hint" data-i18n="act_sub"></p>
      <div class="field">
        <input id="act-code" data-i18n-ph="act_ph" autocapitalize="characters" autocomplete="off" spellcheck="false" class="mono" />
      </div>
      <div class="modal-actions">
        <button class="btn ghost" onclick="UI.closeModal('activate-modal')" data-i18n="cancel"></button>
        <button class="btn primary" onclick="Pro.activate()" data-i18n="act_btn"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="metric-modal">
    <div class="modal">
      <h3 data-i18n="met_edit_title"></h3>
      <div class="field-row">
        <div class="field"><label data-i18n="met_views"></label><input id="met-views" type="number" min="0" inputmode="numeric" /></div>
        <div class="field"><label data-i18n="met_likes"></label><input id="met-likes" type="number" min="0" inputmode="numeric" /></div>
      </div>
      <div class="field-row">
        <div class="field"><label data-i18n="met_comments"></label><input id="met-comments" type="number" min="0" inputmode="numeric" /></div>
        <div class="field">
          <label data-i18n="met_asks"></label>
          <input id="met-asks" type="number" min="0" inputmode="numeric" />
          <div class="subhint" data-i18n="met_asks_hint"></div>
        </div>
      </div>
      <div class="field"><label data-i18n="met_notes"></label><textarea id="met-notes" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="btn danger" onclick="Metricas.deletePost()" data-i18n="met_delete"></button>
        <button class="btn ghost" onclick="UI.closeModal('metric-modal')" data-i18n="cancel"></button>
        <button class="btn primary" onclick="Metricas.saveEdit()" data-i18n="met_save"></button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Orden importa: sin módulos ES para funcionar también desde file:// -->
  <script src="js/i18n.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/persona.js"></script>
  <script src="js/warmup.js"></script>
  <script src="js/guiones.js"></script>
  <script src="js/protocolo.js"></script>
  <script src="js/metricas.js"></script>
  <script src="js/pro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
